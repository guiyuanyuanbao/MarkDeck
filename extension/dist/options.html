<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>MarkDeck 设置</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --border: #e8eaf1;
      --text: #1a1c28;
      --text2: #6f7488;
      --text3: #9ca1b6;
      --primary: #5b67f2;
      --primary-hover: #4a56e6;
      --primary-soft: #eef0fe;
      --danger: #e5484d;
      --danger-soft: #fdeced;
      --success: #23a877;
      --success-soft: #e8f7f1;
      --warning: #f5a623;
      --warning-soft: #fef7e8;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(24,28,58,.05), 0 2px 10px rgba(24,28,58,.06);
      --font: 'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--font); color: var(--text);
      background: var(--bg);
      min-height: 100vh; padding: 0 0 48px;
      -webkit-font-smoothing: antialiased;
    }
    .icon { display: inline-flex; flex-shrink: 0; }
    .icon svg { display: block; }

    /* sticky light header — same single-header language as the web admin */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 13px 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 10px;
      flex-shrink: 0; overflow: hidden;
      box-shadow: 0 2px 8px rgba(91,103,242,.32);
    }
    .logo-mark img { width: 100%; height: 100%; display: block; border-radius: inherit; }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
    .brand-sub { color: var(--text3); font-size: 12px; margin-top: 1px; }
    .topbar-badge {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11.5px; font-weight: 700;
    }

    .wrap { max-width: 620px; margin: 0 auto; padding: 20px 20px 0; }

    /* section card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14.5px; font-weight: 700;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .card-title .title-text { white-space: nowrap; }
    .card-title .icon { color: var(--primary); }
    .card-sub { color: var(--text3); font-size: 12px; font-weight: 400; margin-left: 2px; flex: 1; min-width: 180px; }

    /* connection status row */
    .conn-row { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.online { background: var(--success); box-shadow: 0 0 0 3px rgba(35,168,119,.18); }
    .dot.off { background: var(--warning); box-shadow: 0 0 0 3px rgba(245,166,35,.18); }
    .dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(229,72,77,.15); }
    .dot.none { background: var(--text3); box-shadow: 0 0 0 3px rgba(156,161,182,.18); }
    .conn-title { font-size: 14px; font-weight: 700; }
    .conn-desc { color: var(--text2); font-size: 12.5px; margin-top: 7px; line-height: 1.6; }

    /* steps */
    .steps { margin: 0 0 16px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text2); }
    .steps .n {
      width: 21px; height: 21px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-soft); color: var(--primary);
      font-size: 11px; font-weight: 700;
      display: grid; place-items: center; margin-top: 1px;
    }

    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 13.5px; color: var(--text);
      background: #fafbfd; outline: none;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
    input::placeholder { color: var(--text3); }
    input.paircode { font-family: ui-monospace, monospace; font-size: 17px; letter-spacing: 6px; text-align: center; font-weight: 700; }

    button { font-family: var(--font); }
    .btn-primary {
      background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 10px 20px; font-size: 13.5px; font-weight: 600;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background .15s ease, transform .05s ease;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .btn-ghost {
      background: var(--surface); color: var(--text2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 18px; font-size: 13.5px; font-weight: 600;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: color .15s, border-color .15s, background .15s;
    }
    .btn-ghost:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
    .actions { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }

    .msg { margin-top: 12px; font-size: 13px; padding: 10px 13px; border-radius: var(--radius-sm); display: none; line-height: 1.6; }
    .msg.show { display: block; }
    .msg.ok { background: var(--success-soft); color: var(--success); }
    .msg.err { background: var(--danger-soft); color: var(--danger); }
    .msg.info { background: var(--primary-soft); color: var(--primary); }

    .hint { color: var(--text3); font-size: 12px; line-height: 1.7; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* diagnostics: row list instead of a text blob */
    #diagRows { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
    .diag-row {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 7px 10px; border-radius: 8px;
      font-size: 13px;
    }
    .diag-row:hover { background: var(--bg); }
    .diag-row .diag-ico { flex-shrink: 0; margin-top: 1px; }
    .diag-row.ok .diag-ico { color: var(--success); }
    .diag-row.bad .diag-ico { color: var(--danger); }
    .diag-row.pending .diag-ico { color: var(--text3); }
    .diag-label { flex: 1; color: var(--text); }
    .diag-detail { color: var(--text3); font-size: 12px; }

    .conflict-card { border-color: #f5d98d; background: #fffdf5; }
    .conflict-card .card-title { color: #9a6d0b; }
    .conflict-card .card-title .icon { color: #9a6d0b; }
    .conflict-card .hint { color: #9a6d0b; opacity: .85; }

    code.kbd {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px;
      font-family: ui-monospace, monospace; font-size: 12px; color: var(--text2);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo-mark"><img src="icons/icon128.png" alt="MarkDeck"></div>
    <div>
      <div class="brand-name">MarkDeck 同步设置</div>
      
    </div>
    <span class="topbar-badge" id="versionBadge">v—</span>
  </div>

  <div class="wrap">
    <div class="card" id="connCard" style="display:none">
      <div class="conn-row">
        <span class="dot" id="connDot"></span>
        <span class="conn-title" id="connTitle">检查连接…</span>
      </div>
      <div class="conn-desc" id="connDesc"></div>
    </div>

    <div class="card" id="diagCard" style="display:none">
      <div class="card-title">
        <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <span class="title-text">同步诊断</span>
        <span class="card-sub" id="diagSummary">正在收集…</span>
      </div>
      <div id="diagRows"></div>
      <div class="actions" style="margin-top:12px">
        <button id="diagRefresh" class="btn-ghost">
          <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></span>
          重新检测
        </button>
      </div>
    </div>

    <div class="card conflict-card" id="conflictCard" style="display:none">
      <div class="card-title">
        <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        检测到重复书签
      </div>
      <p class="hint" id="conflictDesc" style="margin-bottom:10px"></p>
      <p class="hint">浏览器自带书签同步（Chrome Sync / Edge 同步）与 MarkDeck 冲突，建议在浏览器同步设置中关闭「书签」一项。</p>
      <button id="openSyncSettings" class="btn-ghost" style="margin-top:10px">
        打开浏览器同步设置
      </button>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>
        连接服务器
      </div>
      <ol class="steps">
        <li><span class="n">1</span><span>在管理页「设置 → 设备同步」生成配对码</span></li>
        <li><span class="n">2</span><span>填写地址与配对码，点击「配对」</span></li>
      </ol>
      <div class="field">
        <label for="server">服务器地址</label>
        <input id="server" placeholder="http://your-server:8990" />
      </div>
      <div class="field">
        <label for="code">配对码（5 分钟内有效）</label>
        <input id="code" class="paircode" placeholder="000000" maxlength="6" inputmode="numeric" />
      </div>
      <div class="actions">
        <button id="pairBtn" class="btn-primary">
          <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          配对并开始同步
        </button>
        <button id="resyncBtn" class="btn-ghost">手动全量同步</button>
      </div>
      <div class="msg" id="pairMsg"></div>
    </div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
