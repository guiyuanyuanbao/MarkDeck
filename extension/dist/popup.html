<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --border: #e8eaf1;
      --text: #1a1c28;
      --text2: #6f7488;
      --text3: #9ca1b6;
      --primary: #5b67f2;
      --primary-soft: #eef0fe;
      --danger: #e5484d;
      --success: #23a877;
      --warning: #f5a623;
      --radius: 12px;
      --radius-sm: 9px;
      --shadow: 0 1px 2px rgba(24,28,58,.05), 0 2px 10px rgba(24,28,58,.06);
      --font: 'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 340px; font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    /* brand header */
    header {
      background: linear-gradient(135deg, #14172a 0%, #191d36 100%);
      padding: 14px 16px 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-mark {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center; color: #fff; flex-shrink: 0;
      overflow: hidden;
    }
    .logo-mark img { width: 100%; height: 100%; display: block; border-radius: inherit; }
    .logo-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: .4px; flex: 1; }

    /* status strip */
    .status {
      margin: 12px 12px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 10px 12px;
      display: flex; align-items: center; gap: 9px;
      font-size: 13px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot.online { background: var(--success); box-shadow: 0 0 0 3px rgba(35,168,119,.18); }
    .dot.off    { background: var(--danger);  box-shadow: 0 0 0 3px rgba(229,72,77,.15); }
    .dot.unconfigured { background: var(--warning); box-shadow: 0 0 0 3px rgba(245,166,35,.18); }
    .dot.unauthorized { background: var(--danger);  box-shadow: 0 0 0 3px rgba(229,72,77,.15); }
    #statusText { color: var(--text); font-weight: 600; }
    #queueInfo { margin-left: auto; color: var(--text3); font-size: 12px; }

    /* cards */
    .card {
      margin: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 14px;
    }
    .card-label { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .4px; margin-bottom: 7px; }

    input {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 13px; color: var(--text);
      background: #fafbfd; outline: none; margin-bottom: 8px;
      transition: border-color .15s ease, background .15s ease;
    }
    input:focus { border-color: var(--primary); background: #fff; }
    input::placeholder { color: var(--text3); }

    button {
      font-family: var(--font); font-size: 13px; font-weight: 600;
      border: none; border-radius: var(--radius-sm);
      padding: 8px 14px; cursor: pointer;
      transition: filter .15s ease, transform .05s ease, background .15s ease;
    }
    button:active { transform: translateY(1px); }
    .btn-primary {
      width: 100%;
      background: var(--primary); color: #fff;
      padding: 9px; font-size: 14px;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: #eef0f6; color: var(--text2); flex: 1; }
    .btn-ghost:hover { background: #e3e6ef; color: var(--text); }

    .row { display: flex; gap: 8px; }
    .saved-msg { color: var(--success); font-size: 12px; font-weight: 600; margin-left: 8px; }

    .conflict {
      margin: 10px 12px 0;
      background: #fef7e8;
      border: 1px solid #f5d98d;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .conflict-title { font-size: 12.5px; font-weight: 700; color: #9a6d0b; }
    .conflict-desc { font-size: 11.5px; color: #9a6d0b; opacity: .85; margin: 4px 0 8px; line-height: 1.5; }
    .offline-banner {
      margin: 10px 12px 0;
      background: #fef7e8;
      border: 1px solid #f5d98d;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .offline-banner.revoked { background: #fdeced; border-color: #f3b6b8; }
    .offline-title { font-size: 12.5px; font-weight: 700; color: #9a6d0b; }
    .offline-banner.revoked .offline-title { color: var(--danger); }
    .offline-desc { font-size: 11.5px; color: #9a6d0b; opacity: .85; margin: 4px 0 6px; line-height: 1.5; }
    .offline-banner.revoked .offline-desc { color: var(--danger); opacity: .9; }
    .offline-queue { font-size: 12px; font-weight: 700; color: #9a6d0b; }
    .hint-line { font-size: 11.5px; color: var(--text3); line-height: 1.5; margin-bottom: 8px; }
    .sync-btn {
      width: 100%; background: #eef0f6; color: var(--text2); font-size: 12.5px;
      padding: 8px;
    }
    .sync-btn:hover { background: #e3e6ef; color: var(--text); }

    /* local search results */
    .search-results { margin-top: 4px; }
    .search-results a {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: var(--radius-sm);
      color: var(--text); text-decoration: none; font-size: 12.5px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .search-results a:hover { background: var(--primary-soft); color: var(--primary); }
    .search-results a .fav-ico {
      width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff;
    }

    footer {
      padding: 10px 14px 14px;
      display: flex; gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-mark"><img src="icons/icon128.png" alt="MarkDeck"></div>
    <div class="logo-name">MarkDeck</div>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">检查中…</span>
    <span id="queueInfo"></span>
  </div>

  <div class="conflict" id="conflictBar" style="display:none">
    <div class="conflict-title">⚠️ 检测到重复书签</div>
    <div class="conflict-desc">可能同时开启了浏览器自带书签同步，两者会互相冲突。</div>
  </div>

  <div class="offline-banner" id="offlineBanner" style="display:none">
    <div class="offline-title" id="offlineTitle">⚠️ 与服务器断联</div>
    <div class="offline-desc">你的改动已保存在本地，恢复连接后会自动同步，书签的查看与搜索不受影响。</div>
    <div class="offline-queue" id="offlineQueue"></div>
  </div>

  <div class="card">
    <div class="card-label">收藏当前页面</div>
    <input id="title" placeholder="标题" />
    <input id="tags" placeholder="标签（逗号分隔，可选）" />
    <button id="saveBtn" class="btn-primary">⭐ 收藏此页面</button>
    <div style="text-align:center; margin-top: 4px"><span class="saved-msg" id="savedMsg"></span></div>
  </div>

  <div class="card">
    <div class="card-label">本地搜索书签（离线可用）</div>
    <input id="localSearch" placeholder="输入关键词…" />
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="card">
    <div class="card-label">浏览器书签同步</div>
    <div class="hint-line">如果同时开启了浏览器自带的账号书签同步，建议关闭该项以避免冲突。</div>
    <button id="openSyncSettings" class="sync-btn">🌐 打开浏览器同步设置</button>
  </div>

  <footer>
    <button id="optionsBtn" class="btn-ghost">⚙️ 设置</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
