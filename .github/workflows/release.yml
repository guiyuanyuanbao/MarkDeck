name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - uses: actions/setup-go@v5
        with: { go-version: "1.23", cache-dependency-path: server/go.sum }

      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Build extension zip
        working-directory: extension
        run: npm ci && npm run build && cd dist && zip -r ../../markdeck-extension.zip . && cd ../..

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Build server binary
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../markdeck-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/markdeck

      - uses: actions/upload-artifact@v4
        with:
          name: markdeck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            markdeck-*
            markdeck-extension.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
