name: CI

# push 到 main：测试 → 构建 → 自动提升补丁版本 → 镜像推 GHCR → 插件/二进制发 Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: server/go.sum }

      - name: Lint server
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: server

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Typecheck + lint + build web
        working-directory: web
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build

      - name: Test extension
        working-directory: extension
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Bump patch version
        id: bump
        run: |
          VER=$(cat VERSION)
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEW" > VERSION
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit new version + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ needs.version.outputs.tag }}" }

      # web build happens INSIDE the Dockerfile; no runner-side npm needed here
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/markdeck:latest
            ghcr.io/${{ github.repository_owner }}/markdeck:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ needs.version.outputs.tag }}" }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: server/go.sum }

      - name: Build extension zip
        working-directory: extension
        run: |
          npm ci && npm run build
          cd dist && zip -r ../../markdeck-extension-${{ needs.version.outputs.version }}.zip . && cd ../..

      - name: Build server binaries
        working-directory: server
        run: |
          LDFLAGS="-s -w -X main.extensionVersion=${{ needs.version.outputs.version }}"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o ../markdeck-linux-amd64   ./cmd/markdeck
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o ../markdeck-linux-arm64   ./cmd/markdeck
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o ../markdeck-windows-amd64.exe ./cmd/markdeck

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: MarkDeck ${{ needs.version.outputs.version }}
          body: |
            自动发布。

            **Docker**: `ghcr.io/${{ github.repository_owner }}/markdeck:${{ needs.version.outputs.version }}`（另有 `latest`）
            **浏览器插件**: 下载 `markdeck-extension-*.zip` 解压后在 Chrome/Edge 加载
            **裸二进制**: linux/amd64、linux/arm64、windows/amd64
          files: |
            markdeck-extension-*.zip
            markdeck-linux-amd64
            markdeck-linux-arm64
            markdeck-windows-amd64.exe
          generate_release_notes: true
